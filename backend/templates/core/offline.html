{% extends "base.html" %}
{% block title %}Offline — {{ PLATFORM_NAME }}{% endblock %}

{% block body %}
<main class="auth-shell flex min-h-screen items-center justify-center px-4 py-10 text-center sm:px-6">
  <section class="auth-panel max-w-md p-8">
    <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-lg bg-primary-50 text-primary-700">
      <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m-2.828-2.828a5 5 0 000-7.072M12 18h.01M8.464 15.536a5 5 0 010-7.072M5.636 18.364a9 9 0 010-12.728"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-950">You are offline</h1>
    <p class="mt-3 text-sm leading-6 text-gray-500">{{ PLATFORM_NAME }} is installed for quick access, but this page needs the local server or internet connection again.</p>
    <a href="{% url 'core:home' %}" class="btn-primary mt-6 justify-center">Try again</a>
  </section>
</main>
{% endblock %}
