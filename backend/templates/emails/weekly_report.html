<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Weekly Report</title></head>
<body style="font-family:sans-serif;max-width:600px;margin:0 auto;padding:20px;color:#374151;">
<h1 style="font-size:20px;color:#111827;">Your weekly {{ platform_name }} report</h1>
<p>Hi {{ user.display_name }},</p>
<p>Here's your scan summary for the past 7 days:</p>
<table style="width:100%;border-collapse:collapse;margin:16px 0;">
  <tr><td style="padding:8px;background:#f9fafb;border:1px solid #e5e7eb;font-weight:600;">Total Scans</td><td style="padding:8px;border:1px solid #e5e7eb;">{{ total_scans }}</td></tr>
  <tr><td style="padding:8px;background:#f9fafb;border:1px solid #e5e7eb;font-weight:600;">Unique Scans</td><td style="padding:8px;border:1px solid #e5e7eb;">{{ unique_scans }}</td></tr>
</table>
<p><a href="{{ platform_url }}/dashboard/" style="color:#4f46e5;">View full dashboard →</a></p>
<p style="font-size:12px;color:#9ca3af;margin-top:32px;">You're receiving this because you opted in. <a href="{{ platform_url }}/accounts/profile/" style="color:#6b7280;">Unsubscribe</a></p>
</body></html>
