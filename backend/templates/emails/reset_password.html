<!DOCTYPE html>
<html><body style="font-family:Inter,sans-serif;background:#f8fafc;padding:40px 20px">
<div style="max-width:520px;margin:0 auto;background:white;border-radius:16px;padding:40px;box-shadow:0 1px 8px rgba(0,0,0,.08)">
  <h1 style="color:#111;font-size:22px;margin:0 0 8px">Reset your password</h1>
  <p style="color:#666;margin:0 0 28px">Hi {{ user.display_name }}, click below to reset your {{ platform_name }} password. This link expires in 2 hours.</p>
  <a href="{{ reset_url }}" style="display:inline-block;background:#6366f1;color:white;padding:14px 28px;border-radius:10px;text-decoration:none;font-weight:600;font-size:15px">Reset Password</a>
  <p style="color:#999;font-size:13px;margin:24px 0 0">If you didn't request a reset, you can safely ignore this email. Your password will not change.</p>
</div>
</body></html>
