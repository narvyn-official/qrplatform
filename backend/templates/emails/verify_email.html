<!DOCTYPE html>
<html><body style="font-family:Inter,sans-serif;background:#f8fafc;padding:40px 20px">
<div style="max-width:520px;margin:0 auto;background:white;border-radius:16px;padding:40px;box-shadow:0 1px 8px rgba(0,0,0,.08)">
  <div style="width:40px;height:40px;background:#6366f1;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:24px">
    <span style="color:white;font-size:20px">⬛</span>
  </div>
  <h1 style="color:#111;font-size:22px;margin:0 0 8px">Verify your email</h1>
  <p style="color:#666;margin:0 0 28px">Hi {{ user.display_name }}, click below to verify your {{ platform_name }} account.</p>
  <a href="{{ verify_url }}" style="display:inline-block;background:#6366f1;color:white;padding:14px 28px;border-radius:10px;text-decoration:none;font-weight:600;font-size:15px">Verify Email Address</a>
  <p style="color:#999;font-size:13px;margin:24px 0 0">This link expires in 24 hours. If you didn't create an account, you can safely ignore this email.</p>
</div>
</body></html>
