{% extends "base.html" %}
{% block title %}Coming Soon — {{ qr.name }}{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-surface-50 px-4">
  <div class="text-center max-w-md">
    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-surface-900 mb-2">Not Live Yet</h1>
    <p class="text-surface-500 mb-4">
      This QR code is scheduled to activate on
      <span class="font-medium text-surface-700">
        {{ qr.scheduled_active_from|date:"N j, Y \a\t g:i A" }}.
      </span>
    </p>
    <p class="text-sm text-surface-400">Check back soon.</p>
  </div>
</div>
{% endblock %}
