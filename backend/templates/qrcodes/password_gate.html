{% extends "base.html" %}
{% block title %}Password Required{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-surface-50">
  <div class="card p-10 text-center max-w-sm w-full mx-4">
    <div class="w-14 h-14 bg-primary-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
      <svg class="w-7 h-7 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>
    <h1 class="text-xl font-bold text-gray-900 mb-1">Password Required</h1>
    <p class="text-gray-500 text-sm mb-6">This QR code is protected. Enter the password to continue.</p>
    {% if error %}<p class="text-red-600 text-sm mb-4 bg-red-50 rounded-xl p-3">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="password" name="password" class="input mb-4" placeholder="Enter password" autofocus required>
      <button type="submit" class="w-full btn-primary justify-center py-3">Continue</button>
    </form>
  </div>
</div>
{% endblock %}
