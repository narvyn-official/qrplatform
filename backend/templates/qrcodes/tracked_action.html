{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block body %}
<main class="min-h-screen bg-surface-50 px-4 py-8">
  <section class="mx-auto max-w-md rounded-lg border border-surface-200 bg-white p-5 text-center shadow-card">
    <p class="text-xs font-semibold uppercase tracking-wider text-primary-700">{{ qr.get_qr_type_display }}</p>
    <h1 class="mt-2 text-2xl font-bold text-gray-950">{{ title }}</h1>
    <p class="mt-3 text-sm leading-6 text-gray-500 break-words">{{ content }}</p>
    <a href="{{ action_url }}" class="btn-primary mt-5 w-full">{{ action_label }}</a>
  </section>
</main>
{% endblock %}
